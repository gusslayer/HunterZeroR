[package]
name = "hunterzero-rust"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "HunterZero portable diagnostics UI for the GPi Case 2W"
license = "MIT"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux talks to the framebuffer and evdev directly. This avoids SDL/OpenGL
# entirely, which matters on the Pi Zero W (VideoCore IV, GLES 2.0 only) and
# makes the binary buildable on a stock PiOS Lite image without extra SDKs.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# On Windows a plain GDI window is used for development. sysinfo supplies the
# process list for the process monitor; the Linux build reads procfs itself.
[target.'cfg(windows)'.dependencies]
sysinfo = "=0.30.13"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
