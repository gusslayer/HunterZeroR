[package]
name = "hunterzero-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
# Graphics library for the GUI
ggez = "0.8"
ggez::input = "0.8"
ggez::graphics = "0.8"
ggez::event = "0.8"

# SDL2 for KMSDRM/EGL backend on Raspberry Pi
sdl2 = "2.8"
sdl2::ttf = "2.8"

# For GPIO on Raspberry Pi (physical shutdown button on GPIO 26)
rppal = "1.5"

# Para obtener información del sistema (CPU, memoria, IP)
sys-infos = "0.1"

# Python embebido (para módulos que aún no se migran a Rust)
pyembed = "0.4"

# Para tiempos y procesos
timeout = "0.2"